<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hevy Garmin Controller</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #007aff;
            --success-color: #34c759;
            --text-color: #ffffff;
            --text-dim: #a0a0a0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #2a2a2a;
        }
        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .exercise-title { font-weight: bold; font-size: 1.1rem; }
        .set-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            align-items: center;
            margin-top: 6px;
        }
        input {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn-send {
            background-color: var(--success-color);
            position: sticky;
            bottom: 16px;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.4);
        }
        .btn-secondary {
            background-color: #2c2c2e;
            color: var(--text-dim);
            padding: 6px 10px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <h1>Éditeur de Séance Temps Réel</h1>

    <div id="workout-container"></div>

    <button onclick="addExercise()" class="btn-secondary" style="margin-bottom: 16px;">+ Ajouter un Exercice</button>
    <button onclick="sendToGarmin()" class="btn-send">Envoyer les modifications à la Fenix 8</button>

    <script>
        // Structure active en mémoire
        let currentRoutine = {
            action: "UPDATE_ROUTINE",
            exercises: [
                {
                    title: "Développé Couché",
                    sets: [{ weight_kg: 80, reps: 10 }, { weight_kg: 85, reps: 8 }]
                },
                {
                    title: "Squat",
                    sets: [{ weight_kg: 100, reps: 5 }, { weight_kg: 105, reps: 5 }]
                }
            ]
        };

        function render() {
            const container = document.getElementById('workout-container');
            container.innerHTML = '';

            currentRoutine.exercises.forEach((ex, exIndex) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="exercise-header">
                        <input type="text" value="${ex.title}" onchange="updateTitle(${exIndex}, this.value)" style="text-align:left; width:70%;">
                        <button class="btn-secondary" onclick="removeExercise(${exIndex})">Suppr.</button>
                    </div>
                    ${ex.sets.map((set, setIndex) => `
                        <div class="set-row">
                            <span style="color:var(--text-dim)">Série ${setIndex + 1}</span>
                            <input type="number" step="0.5" value="${set.weight_kg}" onchange="updateSet(${exIndex}, ${setIndex}, 'weight_kg', this.value)"> kg
                            <input type="number" value="${set.reps}" onchange="updateSet(${exIndex}, ${setIndex}, 'reps', this.value)"> reps
                        </div>
                    `).join('')}
                    <button class="btn-secondary" onclick="addSet(${exIndex})" style="margin-top:10px;">+ Ajouter Série</button>
                `;
                container.appendChild(card);
            });
        }

        function updateTitle(exIndex, val) {
            currentRoutine.exercises[exIndex].title = val;
        }

        function updateSet(exIndex, setIndex, field, val) {
            currentRoutine.exercises[exIndex].sets[setIndex][field] = parseFloat(val);
        }

        function addSet(exIndex) {
            currentRoutine.exercises[exIndex].sets.push({ weight_kg: 0, reps: 0 });
            render();
        }

        function addExercise() {
            currentRoutine.exercises.push({ title: "Nouvel Exercice", sets: [{ weight_kg: 0, reps: 0 }] });
            render();
        }

        function removeExercise(exIndex) {
            currentRoutine.exercises.splice(exIndex, 1);
            render();
        }

        function sendToGarmin() {
            const payload = JSON.stringify(currentRoutine);
            
            // Format URL Scheme Connect IQ Mobile SDK
            const garminUrl = "garmin-connect-iq://messaging?appId=a89e4726-2183-4a0e-976d-c58bc3571d18&data=" + encodeURIComponent(payload);
            
            window.location.href = garminUrl;
            alert("Mise à jour transmise via le canal Bluetooth Garmin !");
        }

        render();
    </script>
</body>
</html>
