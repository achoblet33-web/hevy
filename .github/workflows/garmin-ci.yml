name: Garmin CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fenix-8:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob("**/*.xml", recursive=True):
              ET.parse(path)
          PY
          test "$(find source -maxdepth 1 -name '*.mc' -type f | wc -l)" -eq 6
          test -f resources/drawables/launcher_icon.png
          ! grep -R --line-number -E 'api-key.{0,8}[A-Za-z0-9_-]{20,}' source resources manifest.xml
          ! find . -type f \( -name '*.der' -o -name '*.pem' -o -name '*.key' -o -name '*.iq' -o -name '*.prg' -o -name '*.fit' -o -name '.env*' \) -not -path './.git/*' | grep .

      - name: Generate ephemeral signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in developer_key.pem -out developer_key.der -nocrypt

      - name: Compile for Fenix 8 47mm
        uses: blackshadev/garmin-connectiq-build-action@7f92305153c18b024c9cb02206145ba2415abbb2
        with:
          projectJungle: ./monkey.jungle
          developerKey: ./developer_key.der
          outputPath: out/Hevy.prg
          device: fenix847mm
          typeCheck: '2'

      - name: Upload compiled PRG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hevy-fenix847mm
          path: out/Hevy.prg
          if-no-files-found: error
